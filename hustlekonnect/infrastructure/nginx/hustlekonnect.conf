server {
    listen 443 ssl http2;
    server_name api.hustlekonnect.com;
    root /var/www/hustlekonnect/apps/api/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/api.hustlekonnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hustlekonnect.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ~* \.(env|git|htaccess|sql|bak|log)$ { deny all; return 404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    client_max_body_size 15M;
    gzip on;
}
server { listen 80; server_name api.hustlekonnect.com; return 301 https://$server_name$request_uri; }
