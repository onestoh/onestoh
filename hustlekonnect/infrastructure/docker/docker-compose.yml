version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: hk_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hustlekonnect
      MYSQL_USER: hk_user
      MYSQL_PASSWORD: hk_pass_dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database/hustlekonnect.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3306:3306"
    networks:
      - hk_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hk_net

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: hk_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hustlekonnect
      DB_USERNAME: hk_user
      DB_PASSWORD: hk_pass_dev
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ../../apps/api:/var/www/html
    ports:
      - "8000:8000"
    networks:
      - hk_net

  worker:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: hk_worker
    restart: unless-stopped
    command: php artisan queue:work redis --queue=payments,notifications,bookings,default --sleep=3 --tries=3
    depends_on:
      - api
    environment:
      DB_HOST: mysql
      DB_DATABASE: hustlekonnect
      DB_USERNAME: hk_user
      DB_PASSWORD: hk_pass_dev
      REDIS_HOST: redis
    volumes:
      - ../../apps/api:/var/www/html
    networks:
      - hk_net

  web:
    image: node:20-alpine
    container_name: hk_web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../../apps/web:/app
    ports:
      - "3000:3000"
    networks:
      - hk_net

volumes:
  mysql_data:
  redis_data:

networks:
  hk_net:
    driver: bridge
